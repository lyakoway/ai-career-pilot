name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    # Обязательные CP_* переменные: конфигурация fail-fast валидируется при старте приложения
    env:
      CP_APP_ENV: local
      CP_DATABASE_URL: postgresql+asyncpg://cp_app:cp_app@localhost:5432/careerpilot_ci
      CP_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://cp_migrations:cp_migrations@localhost:5432/careerpilot_ci
      CP_REDIS_URL: redis://localhost:6379/0
      CP_JWT_SECRET: ci-placeholder-jwt-secret-0123456789abcdef
      CP_RATELIMIT_HMAC_KEY: ci-placeholder-hmac-key-0123456789abcdef
      CP_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/careerpilot_test
      CP_TEST_APP_DATABASE_URL: postgresql+asyncpg://cp_app:cp_app@localhost:5432/careerpilot_test
      CP_TEST_MIGRATIONS_DATABASE_URL: postgresql+asyncpg://cp_migrations:cp_migrations@localhost:5432/careerpilot_test
      PGPASSWORD: postgres
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: careerpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      - name: Bootstrap DB roles (cp_app / cp_migrations) on target databases
        run: |
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE careerpilot_migrate"
          for db in careerpilot_test careerpilot_migrate; do
            psql "postgresql://postgres:postgres@localhost:5432/$db" -f docker/db/bootstrap.sql
          done
      - name: Migrations smoke on clean database (upgrade head -> downgrade base)
        run: |
          CP_MIGRATIONS_DATABASE_URL=postgresql+asyncpg://cp_migrations:cp_migrations@localhost:5432/careerpilot_migrate uv run alembic upgrade head
          CP_MIGRATIONS_DATABASE_URL=postgresql+asyncpg://cp_migrations:cp_migrations@localhost:5432/careerpilot_migrate uv run alembic downgrade base
      - run: uv run pytest

  openapi:
    runs-on: ubuntu-latest
    env:
      CP_APP_ENV: local
      CP_DATABASE_URL: postgresql+asyncpg://cp_app:cp_app@localhost:5432/careerpilot_ci
      CP_REDIS_URL: redis://localhost:6379/0
      CP_JWT_SECRET: ci-placeholder-jwt-secret-0123456789abcdef
      CP_RATELIMIT_HMAC_KEY: ci-placeholder-hmac-key-0123456789abcdef
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      - name: Deterministic OpenAPI (byte-identical on regeneration)
        run: |
          uv run python scripts/export_openapi.py openapi.run1.json
          uv run python scripts/export_openapi.py openapi.run2.json
          cmp openapi.run1.json openapi.run2.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.run1.json

  build:
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build backend
