name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      # S1.2: добавить services postgres:16/redis:7 и `alembic upgrade head` перед pytest.
      - run: uv run pytest

  openapi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          working-directory: backend
      - run: uv sync --frozen
      - name: Deterministic OpenAPI (byte-identical on regeneration)
        run: |
          uv run python scripts/export_openapi.py openapi.run1.json
          uv run python scripts/export_openapi.py openapi.run2.json
          cmp openapi.run1.json openapi.run2.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.run1.json

  build:
    runs-on: ubuntu-latest
    needs: [quality, tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build backend
